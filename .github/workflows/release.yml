name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Verify version tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and VERSION do not match.' }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python -m pip install -r requirements.lock.txt
      - run: .\.venv\Scripts\python -m pytest -q
      - run: .\build-windows.ps1
      - run: .\.venv\Scripts\python tests/smoke_windows.py release/Zhishu/Zhishu.exe
      - name: Verify upgrade from v1.0.0
        if: github.ref_name == 'v1.1.0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download v1.0.0 --pattern '*.zip' --dir build/previous-release
          if ($LASTEXITCODE -ne 0) { throw 'Could not download previous release.' }
          Expand-Archive -LiteralPath build/previous-release/Zhishu-v1.0.0-windows-x64.zip -DestinationPath build/previous-release
          .\.venv\Scripts\python tests/upgrade_windows.py build/previous-release/Zhishu/Zhishu.exe release/Zhishu/Zhishu.exe
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade verification failed.' }
      - name: Create verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $archive = "release/Zhishu-v$version-windows-x64.zip"
          gh release create "v$version" $archive "$archive.sha256" --verify-tag --draft --title "Zhishu v$version" --notes-file "docs/releases/v$version.md"
